name: Temporary Vercel deployment

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Deploy anonymously to Vercel
        shell: bash
        run: |
          set -o pipefail
          script -q -e -c 'npx --yes vercel@latest deploy --temporary' /dev/null 2>&1 | tee vercel-deploy.log
          deployment_url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' vercel-deploy.log | tail -n 1)
          if [ -z "$deployment_url" ]; then
            echo "No deployment URL found" >&2
            exit 1
          fi
          echo "Deployment URL: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
